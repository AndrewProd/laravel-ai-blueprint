name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        exclude:
          - laravel: '13'
            php: '8.2'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, tokenizer
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests (includes JSON Schema validation of generated blueprints)
        run: vendor/bin/phpunit

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/pint --test

  install:
    name: Install into a fresh Laravel app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Create Laravel application
        run: composer create-project laravel/laravel app --prefer-dist --no-interaction --no-progress
      - name: Require the package from the checkout
        working-directory: app
        run: |
          composer config repositories.local '{"type": "path", "url": "../package", "options": {"symlink": false}}'
          composer require --dev "andrewprod/laravel-ai-blueprint:*@dev" --no-interaction --no-progress
      - name: Run the workflow
        working-directory: app
        run: |
          php artisan ai-blueprint:init --no-interaction
          php artisan ai-blueprint:review --set="testing_expectations=Feature tests for every endpoint" --no-interaction
          php artisan ai-blueprint:sync --no-interaction
          php artisan ai-blueprint:task "Add customer notifications" --no-interaction
          php artisan ai-blueprint:check
          php artisan ai-blueprint:doctor
          test -f AGENTS.md && test -f CLAUDE.md && test -f .ai-blueprint/blueprint.json
