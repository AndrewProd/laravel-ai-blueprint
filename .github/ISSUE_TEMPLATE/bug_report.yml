name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, credentials or private source code.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: PHP and Laravel versions
      placeholder: PHP 8.3, Laravel 12.10
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran and a minimal project structure (file names, small snippets).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: Include `php artisan ai-blueprint:doctor` and relevant command output.
    validations:
      required: true
