name: Feature request
description: Propose an analyzer, rule, workflow or adapter
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example project structure
      description: A small, anonymized example of the code or layout involved.
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security or compatibility constraints
